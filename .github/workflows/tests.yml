name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# `filament/blueprint` is a paid package served from packages.filamentphp.com, which answers 401 to
# anonymous requests. Composer reads credentials from this variable when there is no auth.json, so no
# file is written and nothing lands on disk for a later step to print.
#
# Workflow level `env` reaches every step of every job, so this is declared once rather than per job.
#
# These two secrets are per repository and do NOT come along when this kit is used to start a project.
# A fresh repo failing here with a 401 has simply never had them set; see "The Filament licence" in the
# README.
env:
  COMPOSER_AUTH: '{"http-basic":{"packages.filamentphp.com":{"username":"${{ secrets.FILAMENT_COMPOSER_USERNAME }}","password":"${{ secrets.FILAMENT_COMPOSER_LICENSE_KEY }}"}}}'

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ "8.5" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The panel resolves its theme from the Vite manifest, so the assets must exist before any
      # test renders a page.
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: composer test:unit

  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.5-

      # Rector and PHPStan are the slowest steps by far, and both are incremental. PHPStan's cache lives
      # in the system temp directory; do not move it under storage/, which phpstan.neon excludes from
      # scanning and which stops Larastan resolving model properties.
      - name: Cache static analysis
        uses: actions/cache@v4
        with:
          path: |
            storage/rector-cache
            /tmp/phpstan
          key: analysis-${{ github.sha }}
          restore-keys: analysis-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check code style (Pint, Rector & Prettier)
        run: composer test:lint

      - name: Static analysis (PHPStan)
        run: composer test:types

      - name: Type coverage
        run: composer test:type-coverage

  install:
    name: Installer
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.5-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # `wirekit:install` is expected to name the database after the project directory and create it
      # itself, so the environment file is deliberately left untouched beyond the example defaults.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Run the installer
        run: php artisan wirekit:install

      - name: Verify the installer created, migrated and seeded the database
        run: |
          DB_NAME=$(grep '^DB_DATABASE=' .env | cut -d '=' -f2-)
          echo "Installer chose database: ${DB_NAME}"
          php -r '
            $database = $argv[1];
            if ($database === "") { fwrite(STDERR, "installer did not write DB_DATABASE\n"); exit(1); }
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname={$database}", "root", "");

            $users = (int) $pdo->query("SELECT COUNT(*) FROM users")->fetchColumn();
            if ($users !== 1) { fwrite(STDERR, "expected 1 seeded administrator, found {$users}\n"); exit(1); }

            // Shield: the seeded administrator must come out as a super admin holding every permission.
            $roles = $pdo->query("SELECT r.name FROM users u
              JOIN model_has_roles mr ON mr.model_id = u.id
              JOIN roles r ON r.id = mr.role_id")->fetchAll(PDO::FETCH_COLUMN);
            if ($roles !== ["super_admin"]) {
              fwrite(STDERR, "expected the first user to be super_admin, got: " . json_encode($roles) . "\n");
              exit(1);
            }

            $permissions = (int) $pdo->query("SELECT COUNT(*) FROM permissions")->fetchColumn();
            $granted = (int) $pdo->query("SELECT COUNT(*) FROM role_has_permissions rp
              JOIN roles r ON r.id = rp.role_id WHERE r.name = \"super_admin\"")->fetchColumn();
            if ($permissions === 0 || $granted !== $permissions) {
              fwrite(STDERR, "super_admin holds {$granted} of {$permissions} permissions\n");
              exit(1);
            }

            echo "verified: {$database} migrated, {$users} super admin holding {$granted}/{$permissions} permissions\n";
          ' "${DB_NAME}"

      - name: Verify the installer is repeatable
        run: php artisan wirekit:install

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      # This job deliberately skips `composer install`, so audit the lock file directly. Without
      # `--locked` the command aborts with "No installed packages found" and exits 1.
      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit NPM dependencies
        run: npm audit --audit-level=high
